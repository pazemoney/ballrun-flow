# Mantém viva a chave de assinatura do APK no cache do Actions (cache sem uso por 7 dias expira).
name: Manter chave do APK
on:
  schedule: [{ cron: '23 7 */4 * *' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with: { path: ~/.android/debug.keystore, key: ballrun-apk-keystore-v1 }
      - run: ls -la ~/.android/debug.keystore || echo "chave ainda não salva (o próximo build da main salva)"
